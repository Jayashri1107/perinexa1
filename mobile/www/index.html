<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E2163" />
    <title>Perinexa – no connection</title>
    <!-- Shown by the app only when https://app.perinexa.com cannot be reached (capacitor.config.json errorPath).
         The app keeps no patient data on the phone. -->
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #E9EBF8; color: #211F5C; font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 360px; margin: 16px; padding: 32px 24px; text-align: center; background: #FFFFFF; border: 1px solid #D9DEEA; border-radius: 24px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 16px 0 8px; font-size: 22px; font-weight: 600; }
      p { margin: 0 0 20px; color: #5C6487; }
      a { display: inline-block; padding: 10px 20px; border-radius: 12px; background: #1E2163; color: #FFFFFF; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon-192.png" alt="" />
      <h1>No internet connection</h1>
      <p>Perinexa needs a connection to show patient records. Nothing is kept on this phone. Check the Wi-Fi or mobile data, then try again.</p>
      <a href="https://app.perinexa.com/">Try again</a>
    </main>
  </body>
</html>

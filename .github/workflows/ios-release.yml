# Builds the iPhone app for the App Store and uploads it to App Store Connect (TestFlight first, then Apple's review).
# Started by hand only: GitHub → Actions → "iOS App Store upload" → Run workflow. It never touches the website.
# Signing: Xcode's automatic signing with an App Store Connect API key (access: Admin) – no certificate files anywhere.
# Needs four repository secrets (GitHub → Settings → Secrets and variables → Actions), never in the code:
#   APPLE_TEAM_ID   the 10-character Team ID (developer.apple.com → Account → Membership details)
#   ASC_KEY_ID      the API key's Key ID (App Store Connect → Users and Access → Integrations → Team Keys)
#   ASC_ISSUER_ID   the Issuer ID shown above that list of keys
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_XXXXXXXXXX.p8 file
# Build number = this workflow's run number, so every upload is new. The version (1.0) is MARKETING_VERSION in Xcode.
name: iOS App Store upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check the Apple secrets are set
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see the top of ios-release.yml)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Xcode version
        run: xcodebuild -version
      - name: Install packages and sync iOS
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios
      - name: API key file (deleted at the end)
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
      - name: Archive (signed for the App Store)
        working-directory: mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Perinexa.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive | tail -80
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Perinexa.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -60
          echo "::notice::Build $GITHUB_RUN_NUMBER uploaded. It appears in App Store Connect → TestFlight after Apple's processing (10-30 minutes)."
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
